<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOCIOKAIROS · Research Suite para Moodle</title>
  <style>

    :root{
      --sk-bg:#eef5fb;
      --sk-card:rgba(255,255,255,.86);
      --sk-card-solid:#ffffff;
      --sk-text:#0f2f4a;
      --sk-muted:#61778c;
      --sk-primary:#083e70;
      --sk-primary-2:#0b65b1;
      --sk-accent:#46b4e8;
      --sk-border:rgba(12,63,105,.14);
      --sk-shadow:0 18px 45px rgba(8,62,112,.14);
      --sk-radius:24px;
    }
    *{ box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at 12% 10%, rgba(70,180,232,.22), transparent 32%),
        radial-gradient(circle at 88% 18%, rgba(8,62,112,.18), transparent 36%),
        linear-gradient(135deg,#f7fbff,#eaf4ff 55%,#f4f8fc);
      color:var(--sk-text);
      min-height:100vh;
    }
    header {
      background: linear-gradient(90deg,#06150f,#0b3d1f,#06150f);
      color: #f8fbff;
      padding: 22px 28px;
      border-bottom:1px solid var(--sk-border);
      box-shadow:0 8px 28px rgba(8,62,112,.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header > div {
      max-width: 1220px;
      margin: 0 auto;
    }
    header img {
      height:72px !important;
      width:72px !important;
      border-radius:14px;
      box-shadow:0 12px 28px rgba(8,62,112,.15), inset 0 0 0 1px rgba(255,255,255,.35);
      background:rgba(255,255,255,.14);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      padding:6px;
    }
    header h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing:.02em;
      font-weight:850;
      color: #ffffff;
      text-shadow:0 1px 2px rgba(0,0,0,.35);
    }
    header p {
      margin: 7px 0 0 0;
      font-size: 15px;
      color: rgba(255,255,255,.86);
      line-height:1.45;
      max-width:980px;
    }
    header .meta {
      margin-top: 8px;
      font-size: 13px;
      color: rgba(255,255,255,.78);
    }
    header a{
      color:#5fc7ff !important;
      text-decoration:none;
      font-weight:700;
    }
    main {
      padding: 28px 28px 52px;
      max-width: 1220px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(360px,.95fr) minmax(420px,1.35fr);
      gap: 22px;
      align-items:start;
    }
    textarea {
      width: 100%;
      min-height: 238px;
      resize: vertical;
      padding: 16px 18px;
      font-family: inherit;
      font-size: 15px;
      line-height:1.55;
      border-radius: 20px;
      border: 1px solid var(--sk-border);
      background:rgba(255,255,255,.82);
      color:var(--sk-text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85);
      outline:none;
      transition:border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }
    textarea:focus {
      border-color: rgba(11,101,177,.55);
      box-shadow:0 0 0 4px rgba(70,180,232,.18);
    }
    .panel {
      background: var(--sk-card);
      border-radius: var(--sk-radius);
      border: 1px solid var(--sk-border);
      padding: 22px 24px;
      box-shadow: var(--sk-shadow);
      font-size: 14px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: skFade .35s ease both;
    }
    .sk-logo { height: 32px; margin-right: 8px; vertical-align: middle; }
    .panel h2 {
      margin-top: 0;
      margin-bottom:16px;
      font-size: 18px;
      color: var(--sk-primary);
      letter-spacing:.01em;
    }
    .panel h3 {
      margin: 18px 0 8px;
      font-size: 14px;
      color: var(--sk-text);
      font-weight:800;
    }
    .panel pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 12.5px;
      line-height:1.55;
      background: rgba(246,250,255,.92);
      border-radius: 18px;
      padding: 14px 16px;
      border: 1px solid rgba(12,63,105,.10);
      margin-bottom: 12px;
      color:#17324a;
      max-height: 360px;
      overflow:auto;
    }
    button {
      border: none;
      border-radius: 16px;
      padding: 11px 18px;
      font-size: 13px;
      cursor: pointer;
      background: linear-gradient(135deg,var(--sk-primary),var(--sk-primary-2));
      color: #fff;
      margin-top: 10px;
      margin-right: 8px;
      font-weight:750;
      box-shadow:0 10px 24px rgba(8,62,112,.18);
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }
    button:hover{
      transform:translateY(-2px);
      box-shadow:0 14px 30px rgba(8,62,112,.25);
    }
    button.secondary {
      background: linear-gradient(135deg,#4b86b6,#1476b8);
    }
    button:disabled {
      opacity: 0.55;
      cursor: default;
      transform:none;
    }
    .tags {
      margin-top: 14px;
      font-size: 12px;
      color: var(--sk-muted);
      line-height:1.9;
    }
    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(11,101,177,.18);
      margin-right: 5px;
      margin-bottom: 5px;
      background:rgba(11,101,177,.08);
      color:#164569;
      font-weight:650;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: var(--sk-muted);
      padding:8px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.72);
      display:inline-block;
      border:1px solid rgba(12,63,105,.10);
    }
    .badge-area {
      display: inline-block;
      margin: 0 0 12px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(11,101,177,.20);
      font-size: 12px;
      background: #e9f4ff;
      color:#12456f;
      font-weight:700;
    }
    .version-selector{
      background:rgba(255,255,255,.70);
      border:1px solid rgba(12,63,105,.12);
      border-radius:18px;
      padding:14px 16px;
      margin:10px 0 14px;
      line-height:1.7;
    }
    .version-selector label{
      cursor:pointer;
      display:inline-block;
      margin:3px 0;
    }
    input[type="radio"]{
      accent-color: var(--sk-primary-2);
      transform:scale(1.08);
      margin-right:6px;
    }
    @keyframes skFade{
      from{opacity:0; transform:translateY(10px);}
      to{opacity:1; transform:translateY(0);}
    }

    .theme-toggle{
      width:112px;
      height:54px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.24);
      background:rgba(255,255,255,.12);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 12px;
      color:#fff;
      box-shadow:0 10px 28px rgba(0,0,0,.22);
      cursor:pointer;
      user-select:none;
    }
    .theme-toggle .sun{font-size:18px;opacity:.95;}
    .theme-toggle .track{
      position:relative;
      width:54px;
      height:30px;
      border-radius:999px;
      background:rgba(255,255,255,.62);
    }
    .theme-toggle .knob{
      position:absolute;
      width:26px;
      height:26px;
      left:2px;
      top:2px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 3px 8px rgba(0,0,0,.25);
      transition:left .18s ease;
    }
    body.sk-dark{
      background:
        radial-gradient(circle at 10% 10%, rgba(70,180,232,.12), transparent 30%),
        linear-gradient(135deg,#06111d,#0e2438 55%,#06111d);
    }
    body.sk-dark .panel{background:rgba(10,28,44,.88); color:#f5f9ff; border-color:rgba(255,255,255,.10);}
    body.sk-dark .panel h2, body.sk-dark .panel h3{color:#f8fbff;}
    body.sk-dark textarea{background:rgba(255,255,255,.08); color:#fff; border-color:rgba(255,255,255,.18);}
    body.sk-dark .panel pre{background:rgba(255,255,255,.08); color:#f5f9ff; border-color:rgba(255,255,255,.12);}
    body.sk-dark .version-selector{background:rgba(255,255,255,.08); color:#f5f9ff; border-color:rgba(255,255,255,.12);}
    body.sk-dark .badge{background:rgba(95,199,255,.16); color:#e8f7ff; border-color:rgba(95,199,255,.28);}
    body.sk-dark .badge-area{background:rgba(95,199,255,.16); color:#e8f7ff; border-color:rgba(95,199,255,.28);}
    body.sk-dark .status{background:rgba(255,255,255,.10); color:#cfe0f0; border-color:rgba(255,255,255,.16);}
    body.sk-dark .theme-toggle .knob{left:26px;}

    @media (max-width: 980px) {
      .grid { grid-template-columns: 1fr; }
      header h1{font-size:22px;}
      main{padding:20px;}
    }


/* --- SOCIOKAIROS EDU V36: botonera unificada y datos abajo --- */
header{
  min-height: 138px !important;
}
header > div{
  max-width: 1400px !important;
}
.sk-controls-clean{
  display:flex !important;
  gap:16px !important;
  align-items:center !important;
  justify-content:flex-end !important;
  flex-shrink:0 !important;
}
.sk-theme-toggle-clean{
  height:54px !important;
  min-width:132px !important;
  border-radius:999px !important;
  border:1px solid rgba(255,255,255,.28) !important;
  background:rgba(255,255,255,.13) !important;
  color:#ffffff !important;
  display:flex !important;
  align-items:center !important;
  justify-content:space-around !important;
  gap:10px !important;
  padding:0 14px !important;
  box-shadow:0 10px 26px rgba(0,0,0,.22) !important;
  backdrop-filter:blur(8px) !important;
  -webkit-backdrop-filter:blur(8px) !important;
  cursor:pointer !important;
}
.sk-track{
  position:relative !important;
  width:56px !important;
  height:32px !important;
  border-radius:999px !important;
  background:rgba(255,255,255,.45) !important;
  display:inline-block !important;
}
.sk-knob{
  position:absolute !important;
  left:3px !important;
  top:3px !important;
  width:26px !important;
  height:26px !important;
  border-radius:50% !important;
  background:#ffffff !important;
  box-shadow:0 3px 10px rgba(0,0,0,.28) !important;
  transition:left .18s ease !important;
}
body.sk-dark .sk-knob{
  left:27px !important;
}
.sk-sun,.sk-moon{
  font-size:20px !important;
  color:#ffffff !important;
  line-height:1 !important;
  font-weight:800 !important;
}
.sk-icon-btn-clean{
  width:56px !important;
  height:56px !important;
  border-radius:16px !important;
  border:1px solid rgba(255,255,255,.28) !important;
  background:rgba(255,255,255,.13) !important;
  color:#ffffff !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  font-size:24px !important;
  font-weight:900 !important;
  line-height:1 !important;
  cursor:pointer !important;
  box-shadow:0 10px 26px rgba(0,0,0,.22) !important;
  backdrop-filter:blur(8px) !important;
  -webkit-backdrop-filter:blur(8px) !important;
}
.sk-icon-btn-clean:hover,.sk-theme-toggle-clean:hover{
  background:rgba(255,255,255,.23) !important;
}
.sk-lang-switcher{
  display:flex !important;
  gap:2px !important;
  align-items:center !important;
  padding:4px !important;
  border-radius:14px !important;
  border:1px solid rgba(255,255,255,.28) !important;
  background:rgba(255,255,255,.13) !important;
  backdrop-filter:blur(8px) !important;
  -webkit-backdrop-filter:blur(8px) !important;
}
.sk-lang-btn{
  width:36px !important;
  height:36px !important;
  border-radius:10px !important;
  border:none !important;
  background:transparent !important;
  font-size:19px !important;
  line-height:1 !important;
  cursor:pointer !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  opacity:.55 !important;
  filter:grayscale(55%) !important;
  transition:opacity .15s ease, filter .15s ease, background .15s ease !important;
}
.sk-lang-btn:hover{
  opacity:.85 !important;
  filter:grayscale(15%) !important;
}
.sk-lang-btn.active{
  opacity:1 !important;
  filter:grayscale(0%) !important;
  background:rgba(255,255,255,.28) !important;
}
.sk-footer-author{
  margin-top:40px !important;
  width:100% !important;
  text-align:center !important;
  padding:18px 20px 22px !important;
  color:#16324f !important;
  font-size:15px !important;
  line-height:1.6 !important;
  background:rgba(255,255,255,.78) !important;
  border-top:1px solid rgba(8,62,112,.14) !important;
}
.sk-footer-author a{
  color:#006bb6 !important;
  text-decoration:none !important;
  font-weight:800 !important;
}
.sk-footer-author a:hover{
  text-decoration:underline !important;
}
body.sk-dark .sk-footer-author{
  background:rgba(10,28,44,.92) !important;
  color:#f5f9ff !important;
  border-top:1px solid rgba(255,255,255,.14) !important;
}
body.sk-dark .sk-footer-author a{
  color:#5fc7ff !important;
}
@media(max-width:980px){
  header > div{
    flex-direction:column !important;
    align-items:flex-start !important;
  }
  .sk-controls-clean{
    margin-left:90px !important;
  }
}


/* --- SOCIOKAIROS EDU V38: datos visibles arriba --- */
.sk-author-top{
  display:block !important;
  margin-top:8px !important;
  color:#f7fbff !important;
  font-size:15px !important;
  font-weight:600 !important;
  letter-spacing:.1px !important;
  text-shadow:0 1px 3px rgba(0,0,0,.35) !important;
  opacity:1 !important;
  visibility:visible !important;
}
.sk-author-top a{
  color:#64c8ff !important;
  text-decoration:none !important;
  font-weight:800 !important;
}
.sk-author-top a:hover{
  text-decoration:underline !important;
}
header{
  min-height:150px !important;
}



/* --- FIX SOCIOKAIROS EDU II: visibilidad del selector de versión 2.1 ---
   No modifica la lógica ni la sección 2.3. Solo corrige contraste/legibilidad. */
.version-selector,
.version-selector p,
.version-selector label,
.version-selector .meta,
#version_elegida_hint {
  color: var(--sk-text) !important;
  opacity: 1 !important;
  text-shadow: none !important;
}
.version-selector {
  background: rgba(255,255,255,.88) !important;
}
.version-selector label {
  display: block !important;
  padding: 6px 8px !important;
  border-radius: 12px !important;
  font-weight: 650 !important;
}
.version-selector label:hover {
  background: rgba(11,101,177,.08) !important;
}
.version-selector input[type="radio"] {
  appearance: auto !important;
  -webkit-appearance: radio !important;
  accent-color: var(--sk-primary-2) !important;
  opacity: 1 !important;
  transform: scale(1.12) !important;
  margin-right: 8px !important;
  vertical-align: middle !important;
}
body.sk-dark .version-selector,
body.sk-dark .version-selector p,
body.sk-dark .version-selector label,
body.sk-dark .version-selector .meta,
body.sk-dark #version_elegida_hint {
  color: #f5f9ff !important;
}
body.sk-dark .version-selector {
  background: rgba(10,28,44,.92) !important;
}
body.sk-dark .version-selector label:hover {
  background: rgba(95,199,255,.14) !important;
}

.sk-historial-lista{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin:8px 0 4px;
}
.sk-historial-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  text-align:left;
  padding:8px 12px;
  border-radius:14px;
  border:1px solid rgba(12,63,105,.14);
  background:rgba(255,255,255,.72);
  color:var(--sk-text);
  font-size:12.5px;
  line-height:1.4;
  cursor:pointer;
  width:100%;
}
.sk-historial-item:hover{
  background:rgba(11,101,177,.08);
}
.sk-historial-item .sk-historial-texto{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.sk-historial-item .sk-historial-fecha{
  flex-shrink:0;
  font-size:11px;
  color:var(--sk-muted);
}
.sk-historial-vacio{
  font-size:12.5px;
  color:var(--sk-muted);
  font-style:italic;
}
body.sk-dark .sk-historial-item{
  background:rgba(255,255,255,.08);
  color:#f5f9ff;
  border-color:rgba(255,255,255,.14);
}
body.sk-dark .sk-historial-item:hover{
  background:rgba(95,199,255,.14);
}
body.sk-dark .sk-historial-item .sk-historial-fecha{
  color:#9fb6cf;
}

</style>
</head>
