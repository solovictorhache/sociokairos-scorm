<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOCIOKAIROS · Research Suite</title>
  <style>

    :root{
      --sk-bg:#f4f8f4;
      --sk-card:rgba(255,255,255,.88);
      --sk-card-solid:#ffffff;
      --sk-text:#122016;
      --sk-muted:#5a6b5e;
      --sk-primary:#1c7a4c;
      --sk-primary-2:#2fae72;
      --sk-accent:#3ecf8e;
      --sk-border:rgba(20,60,38,.13);
      --sk-shadow:0 14px 38px rgba(20,60,38,.10);
      --sk-radius:16px;
      --sk-toolbar-bg:rgba(250,252,250,.86);
      --sk-toolbar-border:rgba(20,60,38,.10);
      --sk-sidebar-bg:rgba(255,255,255,.55);
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: var(--sk-bg);
      color:var(--sk-text);
      min-height:100vh;
    }

    .sk-app{
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    /* --- Topbar: translúcida, clara, con stepper central --- */
    .sk-topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:10px 20px;
      background: var(--sk-toolbar-bg);
      border-bottom:1px solid var(--sk-toolbar-border);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      position: sticky;
      top: 0;
      z-index: 30;
      flex-wrap:wrap;
    }
    .sk-topbar-brand{
      display:flex;
      align-items:center;
      gap:12px;
      flex-shrink:0;
    }
    .sk-topbar-logo{
      height:38px;
      width:38px;
      border-radius:10px;
      box-shadow:0 4px 14px rgba(20,60,38,.16);
      background:white;
      padding:3px;
    }
    .sk-topbar-title{
      font-size:16px;
      font-weight:800;
      letter-spacing:.01em;
      color:var(--sk-text);
    }
    .sk-topbar-title .sk-topbar-sub{
      font-weight:500;
      color:var(--sk-muted);
    }
    .sk-topbar-tagline{
      font-size:9.5px;
      letter-spacing:.14em;
      color:var(--sk-primary);
      font-weight:700;
    }

    .sk-stepper{
      display:flex;
      align-items:center;
      gap:2px;
      background: rgba(28,122,76,.06);
      border:1px solid var(--sk-border);
      border-radius:999px;
      padding:4px;
    }
    .sk-step{
      display:flex;
      align-items:center;
      gap:7px;
      border:none;
      background:transparent;
      color:var(--sk-muted);
      font-size:12.5px;
      font-weight:650;
      padding:7px 13px;
      border-radius:999px;
      cursor:pointer;
      margin:0;
      box-shadow:none;
    }
    .sk-step:hover{ background:rgba(28,122,76,.10); color:var(--sk-text); }
    .sk-step.active{
      background: var(--sk-primary);
      color:#fff;
    }
    .sk-step-num{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:18px;
      height:18px;
      border-radius:50%;
      background:rgba(255,255,255,.30);
      font-size:10.5px;
    }
    .sk-step:not(.active) .sk-step-num{
      background:rgba(28,122,76,.14);
      color:var(--sk-primary);
    }

    .sk-topbar-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }
    .sk-theme-toggle-clean{
      height:32px;
      min-width:70px;
      border-radius:999px;
      border:1px solid var(--sk-border);
      background:rgba(28,122,76,.08);
      color:var(--sk-text);
      display:flex;
      align-items:center;
      justify-content:space-around;
      gap:6px;
      padding:0 9px;
      cursor:pointer;
      margin:0;
      box-shadow:none;
    }
    .sk-track{
      position:relative;
      width:30px;
      height:17px;
      border-radius:999px;
      background:rgba(28,122,76,.20);
      display:inline-block;
    }
    .sk-knob{
      position:absolute;
      left:2px;
      top:2px;
      width:13px;
      height:13px;
      border-radius:50%;
      background: var(--sk-primary);
      box-shadow:0 1px 3px rgba(0,0,0,.25);
      transition:left .18s ease;
    }
    body.sk-dark .sk-knob{ left:15px; }
    .sk-sun,.sk-moon{ font-size:11px; line-height:1; }
    .sk-icon-btn-clean{
      width:32px;
      height:32px;
      border-radius:9px;
      border:1px solid var(--sk-border);
      background:rgba(28,122,76,.08);
      color:var(--sk-text);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      cursor:pointer;
      margin:0;
      box-shadow:none;
      position:relative;
    }
    .sk-icon-btn-clean:hover,.sk-theme-toggle-clean:hover{
      background:rgba(28,122,76,.16);
    }
    .sk-badge-count{
      position:absolute;
      top:-4px;
      right:-4px;
      min-width:15px;
      height:15px;
      padding:0 3px;
      border-radius:999px;
      background:#d64545;
      color:#fff;
      font-size:9px;
      font-weight:800;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1;
    }

    /* --- Barra de estado, siempre visible bajo la topbar --- */
    .sk-statusbar{
      padding:6px 20px;
      font-size:12px;
      color:var(--sk-muted);
      background:rgba(28,122,76,.05);
      border-bottom:1px solid var(--sk-toolbar-border);
    }

    /* --- Cuerpo: sidebar + main + panel derecho --- */
    .sk-body{
      display:grid;
      grid-template-columns: 220px minmax(0,1fr) 280px;
      flex:1;
      min-height:0;
    }
    .sk-sidebar{
      background: var(--sk-sidebar-bg);
      border-right:1px solid var(--sk-border);
      padding:16px 12px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .sk-sidebar-footer{
      margin-top:auto;
      padding:10px 4px 2px;
      border-top:1px solid var(--sk-border);
      font-size:10.5px;
      line-height:1.5;
      color:var(--sk-muted);
    }
    .sk-sidebar-footer .sk-author-top a{
      color: var(--sk-primary);
      text-decoration:none;
      font-weight:650;
    }
    .sk-sidebar-footer .sk-author-top a:hover{ text-decoration:underline; }
    .sk-sidebar-nav{
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    .sk-sidebar-item{
      display:block;
      text-align:left;
      border:none;
      background:transparent;
      color:var(--sk-muted);
      font-size:13px;
      font-weight:600;
      padding:9px 12px;
      border-radius:9px;
      cursor:pointer;
      margin:0;
      box-shadow:none;
      width:100%;
    }
    .sk-sidebar-item:hover{ background:rgba(28,122,76,.08); color:var(--sk-text); }
    .sk-sidebar-item.active{ background:rgba(28,122,76,.14); color:var(--sk-primary); }
    .sk-sidebar-section h3{
      margin:0 0 8px;
      font-size:11.5px;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:var(--sk-muted);
      font-weight:750;
      padding:0 4px;
    }
    .sk-search-input{
      width:100%;
      padding:7px 10px;
      font-size:12.5px;
      border-radius:9px;
      border:1px solid var(--sk-border);
      background:#ffffff;
      color:var(--sk-text);
      margin-bottom:8px;
      outline:none;
    }
    .sk-search-input:focus{ border-color:var(--sk-primary-2); }

    .sk-main{
      padding:20px;
      overflow-x:hidden;
      min-width:0;
    }
    .sk-rightpanel{
      background: var(--sk-sidebar-bg);
      border-left:1px solid var(--sk-border);
      padding:18px 16px;
    }
    .sk-rightpanel h3{
      margin:18px 0 10px;
      font-size:11.5px;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:var(--sk-muted);
      font-weight:750;
    }
    .sk-rightpanel h3:first-child{ margin-top:0; }
    .sk-stats-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .sk-stat{
      background:#ffffff;
      border:1px solid var(--sk-border);
      border-radius:12px;
      padding:10px 10px;
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .sk-stat-num{
      font-size:20px;
      font-weight:800;
      color:var(--sk-primary);
    }
    .sk-stat-label{
      font-size:10px;
      color:var(--sk-muted);
      line-height:1.3;
    }
    .sk-fuentes-preview{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .sk-fuente-item{
      font-size:11.5px;
      line-height:1.4;
      padding:8px 10px;
      background:#ffffff;
      border:1px solid var(--sk-border);
      border-radius:10px;
      color:var(--sk-text);
      word-break:break-word;
    }
    .sk-fuente-item a{ color:var(--sk-primary); text-decoration:none; }
    .sk-fuente-item a:hover{ text-decoration:underline; }

    textarea {
      width: 100%;
      min-height: 200px;
      resize: vertical;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 14.5px;
      line-height:1.55;
      border-radius: 12px;
      border: 1px solid var(--sk-border);
      background:#ffffff;
      color:var(--sk-text);
      outline:none;
      transition:border-color .16s ease, box-shadow .16s ease;
    }
    textarea:focus {
      border-color: var(--sk-primary-2);
      box-shadow:0 0 0 3px rgba(62,207,142,.20);
    }
    .panel {
      background: var(--sk-card);
      border-radius: var(--sk-radius);
      border: 1px solid var(--sk-border);
      padding: 20px 22px;
      box-shadow: var(--sk-shadow);
      font-size: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      margin-bottom:18px;
    }
    .panel h2 {
      margin-top: 0;
      margin-bottom:14px;
      font-size: 16px;
      font-weight:700;
      color: var(--sk-text);
      letter-spacing:.01em;
    }
    .panel h3 {
      margin: 16px 0 6px;
      font-size: 13px;
      color: var(--sk-text);
      font-weight:700;
    }
    .panel pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 12.5px;
      line-height:1.55;
      background: #f7faf7;
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--sk-border);
      margin-bottom: 10px;
      color:var(--sk-text);
      max-height: 360px;
      overflow:auto;
    }
    button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 15px;
      font-size: 13px;
      cursor: pointer;
      background: var(--sk-primary);
      color: #fff;
      margin-top: 8px;
      margin-right: 8px;
      font-weight:600;
      transition: background .15s ease, opacity .15s ease, transform .1s ease;
    }
    button:hover{ background: var(--sk-primary-2); }
    button:active{ transform: scale(.98); }
    button.secondary {
      background: rgba(28,122,76,.10);
      color: var(--sk-primary);
      border-color: var(--sk-border);
    }
    button.secondary:hover{ background: rgba(28,122,76,.18); }
    button:disabled { opacity: 0.5; cursor: default; transform:none; }

    .tags { margin-top: 12px; font-size: 11.5px; color: var(--sk-muted); line-height:1.9; }
    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--sk-border);
      margin-right: 5px;
      margin-bottom: 5px;
      background:rgba(28,122,76,.07);
      color:var(--sk-primary);
      font-weight:600;
    }
    .badge-area {
      display: inline-block;
      margin: 0 0 12px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--sk-border);
      font-size: 12px;
      background: rgba(28,122,76,.09);
      color:var(--sk-primary);
      font-weight:650;
    }
    .version-selector{
      background:#f7faf7;
      border:1px solid var(--sk-border);
      border-radius:12px;
      padding:12px 14px;
      margin:8px 0 12px;
      line-height:1.7;
    }
    .version-selector label{ cursor:pointer; display:block; padding:4px 6px; border-radius:8px; font-weight:600; }
    .version-selector label:hover{ background: rgba(28,122,76,.07); }
    input[type="radio"]{ accent-color: var(--sk-primary); transform:scale(1.05); margin-right:6px; vertical-align:middle; }

    body.sk-dark{
      --sk-bg:#0d1712;
      --sk-card:rgba(18,32,24,.86);
      --sk-card-solid:#12201a;
      --sk-text:#eaf5ee;
      --sk-muted:#93a89b;
      --sk-border:rgba(120,200,150,.16);
      --sk-toolbar-bg:rgba(13,23,18,.78);
      --sk-toolbar-border:rgba(120,200,150,.12);
      --sk-sidebar-bg:rgba(15,27,20,.6);
    }
    body.sk-dark textarea{ background:#12201a; color:var(--sk-text); }
    body.sk-dark .panel pre{ background:#0f1c15; color:var(--sk-text); }
    body.sk-dark .version-selector{ background:#0f1c15; }
    body.sk-dark .sk-theme-toggle-clean,
    body.sk-dark .sk-icon-btn-clean{ background:rgba(62,207,142,.10); }
    body.sk-dark .sk-theme-toggle-clean:hover,
    body.sk-dark .sk-icon-btn-clean:hover{ background:rgba(62,207,142,.18); }
    body.sk-dark .sk-search-input,
    body.sk-dark .sk-stat,
    body.sk-dark .sk-fuente-item{ background:#12201a; }
    body.sk-dark .sk-step:not(.active) .sk-step-num{ background:rgba(62,207,142,.14); color:var(--sk-accent); }

    .sk-historial-lista{ display:flex; flex-direction:column; gap:6px; margin:0 0 4px; }
    .sk-historial-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      text-align:left;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid var(--sk-border);
      background:#ffffff;
      color:var(--sk-text);
      font-size:11.5px;
      line-height:1.4;
      cursor:pointer;
      width:100%;
    }
    .sk-historial-item:hover{ background: rgba(28,122,76,.06); }
    .sk-historial-item .sk-historial-texto{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sk-historial-item .sk-historial-fecha{ flex-shrink:0; font-size:10px; color:var(--sk-muted); }
    .sk-historial-vacio{ font-size:12px; color:var(--sk-muted); font-style:italic; }
    body.sk-dark .sk-historial-item{ background:#12201a; }
    body.sk-dark .sk-historial-item:hover{ background: rgba(62,207,142,.10); }

    .visual-svg-box{
      overflow-x:auto;
      border:1px solid var(--sk-border);
      border-radius:12px;
      padding:10px;
      background:#f7faf7;
      margin-bottom:14px;
    }
    body.sk-dark .visual-svg-box{ background:#0f1c15; }

    @media (max-width: 1180px) {
      .sk-body{ grid-template-columns: 190px minmax(0,1fr); }
      .sk-rightpanel{ display:none; }
    }
    @media (max-width: 820px) {
      .sk-body{ grid-template-columns: 1fr; }
      .sk-sidebar{ display:none; }
      .sk-stepper{ order:3; width:100%; justify-content:center; }
      .sk-topbar{ flex-direction:column; align-items:stretch; }
    }

  </style>
</head>
