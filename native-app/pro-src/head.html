<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOCIOKAIROS · Research Suite</title>
  <style>

    :root{
      --sk-bg:#f4f8f4;
      --sk-card:rgba(255,255,255,.88);
      --sk-card-solid:#ffffff;
      --sk-text:#122016;
      --sk-muted:#5a6b5e;
      --sk-primary:#1c7a4c;
      --sk-primary-2:#2fae72;
      --sk-accent:#3ecf8e;
      --sk-border:rgba(20,60,38,.13);
      --sk-shadow:0 14px 38px rgba(20,60,38,.10);
      --sk-radius:16px;
      --sk-toolbar-bg:rgba(250,252,250,.86);
      --sk-toolbar-border:rgba(20,60,38,.10);
      --sk-sidebar-bg:rgba(255,255,255,.55);
      --sk-glow: rgba(46,174,114,.30);
      --sk-glow-strong: rgba(46,174,114,.55);
      --sk-mesh-1: rgba(62,207,142,.16);
      --sk-mesh-2: rgba(28,122,76,.10);
      --sk-grid-line: rgba(28,122,76,.05);
    }
    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background: var(--sk-bg);
      color:var(--sk-text);
      min-height:100vh;
    }

    /* --- Fondo tipo "sala de control": mesh de luz verde + retícula fina,
       fijo y decorativo, sin afectar la legibilidad del contenido --- */
    .sk-mesh-bg{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-image:
        radial-gradient(650px 420px at 8% -6%, var(--sk-mesh-1), transparent 60%),
        radial-gradient(620px 460px at 108% 12%, var(--sk-mesh-2), transparent 60%),
        radial-gradient(520px 420px at 50% 118%, var(--sk-mesh-2), transparent 65%),
        repeating-linear-gradient(0deg, var(--sk-grid-line) 0 1px, transparent 1px 42px),
        repeating-linear-gradient(90deg, var(--sk-grid-line) 0 1px, transparent 1px 42px);
      transition: background-image .25s ease;
    }

    .sk-app{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      min-height:100vh;
    }

    /* --- Topbar: translúcida, clara, con stepper central --- */
    .sk-topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:10px 20px;
      background: var(--sk-toolbar-bg);
      border-bottom:1px solid var(--sk-toolbar-border);
      backdrop-filter: blur(20px) saturate(1.4);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      position: sticky;
      top: 0;
      z-index: 30;
      flex-wrap:wrap;
    }
    .sk-topbar-brand{
      display:flex;
      align-items:center;
      gap:12px;
      flex-shrink:0;
    }
    .sk-topbar-logo{
      height:38px;
      width:38px;
      filter:
        drop-shadow(-1px -1px 1px rgba(255,255,255,.7))
        drop-shadow(1.5px 2px 2.5px rgba(20,60,38,.35));
    }
    .sk-topbar-title{
      font-size:16px;
      font-weight:800;
      letter-spacing:.01em;
      background: linear-gradient(100deg, var(--sk-text) 30%, var(--sk-primary-2) 65%, var(--sk-accent) 100%);
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color: transparent;
    }
    .sk-topbar-title .sk-topbar-sub{
      font-weight:500;
      color:var(--sk-muted);
      -webkit-text-fill-color: var(--sk-muted);
    }
    .sk-topbar-tagline{
      font-size:9.5px;
      letter-spacing:.14em;
      color:var(--sk-primary);
      font-weight:700;
      position:relative;
    }
    .sk-topbar-tagline::before{
      content:"";
      display:inline-block;
      width:5px; height:5px;
      border-radius:50%;
      background: var(--sk-accent);
      margin-right:5px;
      box-shadow:0 0 6px 1px var(--sk-glow-strong);
      animation: sk-live-pulse 2.4s ease-in-out infinite;
      vertical-align:middle;
    }
    @keyframes sk-live-pulse{
      0%,100%{ opacity:1; transform:scale(1); }
      50%{ opacity:.45; transform:scale(.72); }
    }
    /* Línea de escaneo sutil bajo la topbar, refuerza la sensación de panel
       de control "vivo" sin animar nada que transmita datos falsos */
    .sk-topbar::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:-1px;
      height:1px;
      background: linear-gradient(90deg, transparent, var(--sk-accent), transparent);
      background-size:220% 100%;
      opacity:.55;
      animation: sk-scan 7s linear infinite;
    }
    @keyframes sk-scan{
      0%{ background-position: 220% 0; }
      100%{ background-position: -20% 0; }
    }

    .sk-stepper{
      display:flex;
      align-items:center;
      gap:2px;
      background: rgba(28,122,76,.06);
      border:1px solid var(--sk-border);
      border-radius:999px;
      padding:4px;
    }
    .sk-step{
      display:flex;
      align-items:center;
      gap:7px;
      border:none;
      background:transparent;
      color:var(--sk-muted);
      font-size:12.5px;
      font-weight:650;
      padding:7px 13px;
      border-radius:999px;
      cursor:pointer;
      margin:0;
      box-shadow:none;
    }
    .sk-step:hover{ background:rgba(28,122,76,.10); color:var(--sk-text); }
    .sk-step.active{
      background: linear-gradient(135deg, var(--sk-primary), var(--sk-primary-2));
      color:#fff;
      box-shadow: 0 2px 10px rgba(20,60,38,.22), 0 0 0 1px rgba(255,255,255,.14) inset, 0 0 16px var(--sk-glow);
    }
    .sk-step-num{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:18px;
      height:18px;
      border-radius:50%;
      background:rgba(255,255,255,.30);
      font-size:10.5px;
    }
    .sk-step:not(.active) .sk-step-num{
      background:rgba(28,122,76,.14);
      color:var(--sk-primary);
    }

    .sk-topbar-actions{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }
    .sk-theme-toggle-clean{
      height:32px;
      min-width:70px;
      border-radius:999px;
      border:1px solid var(--sk-border);
      background:rgba(28,122,76,.08);
      color:var(--sk-text);
      display:flex;
      align-items:center;
      justify-content:space-around;
      gap:6px;
      padding:0 9px;
      cursor:pointer;
      margin:0;
      box-shadow:none;
    }
    .sk-track{
      position:relative;
      width:30px;
      height:17px;
      border-radius:999px;
      background:rgba(28,122,76,.20);
      display:inline-block;
    }
    .sk-knob{
      position:absolute;
      left:2px;
      top:2px;
      width:13px;
      height:13px;
      border-radius:50%;
      background: var(--sk-primary);
      box-shadow:0 1px 3px rgba(0,0,0,.25);
      transition:left .18s ease;
    }
    body.sk-dark .sk-knob{ left:15px; }
    .sk-sun,.sk-moon{ font-size:11px; line-height:1; }
    .sk-icon-btn-clean{
      width:32px;
      height:32px;
      border-radius:9px;
      border:1px solid var(--sk-border);
      background:rgba(28,122,76,.08);
      color:var(--sk-text);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      cursor:pointer;
      margin:0;
      box-shadow:none;
      position:relative;
    }
    .sk-icon-btn-clean:hover,.sk-theme-toggle-clean:hover{
      background:rgba(28,122,76,.16);
    }
    .sk-lang-switcher{
      display:flex;
      gap:2px;
      align-items:center;
      padding:2px;
      border-radius:10px;
      border:1px solid var(--sk-border);
      background:rgba(28,122,76,.08);
    }
    .sk-lang-btn{
      width:26px;
      height:26px;
      border-radius:7px;
      border:none;
      background:transparent;
      font-size:14px;
      line-height:1;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:.55;
      filter:grayscale(55%);
      transition:opacity .15s ease, filter .15s ease, background .15s ease;
    }
    .sk-lang-btn:hover{
      opacity:.85;
      filter:grayscale(15%);
    }
    .sk-lang-btn.active{
      opacity:1;
      filter:grayscale(0%);
      background:rgba(28,122,76,.16);
    }
    .sk-badge-count{
      position:absolute;
      top:-4px;
      right:-4px;
      min-width:15px;
      height:15px;
      padding:0 3px;
      border-radius:999px;
      background:#d64545;
      color:#fff;
      font-size:9px;
      font-weight:800;
      display:flex;
      align-items:center;
      justify-content:center;
      line-height:1;
      box-shadow:0 0 0 0 rgba(214,69,69,.55);
      animation: sk-badge-ring 2.2s ease-out infinite;
    }
    @keyframes sk-badge-ring{
      0%{ box-shadow:0 0 0 0 rgba(214,69,69,.5); }
      70%{ box-shadow:0 0 0 6px rgba(214,69,69,0); }
      100%{ box-shadow:0 0 0 0 rgba(214,69,69,0); }
    }

    /* --- Barra de estado, siempre visible bajo la topbar --- */
    .sk-statusbar{
      padding:6px 20px;
      font-size:12px;
      color:var(--sk-muted);
      background:rgba(28,122,76,.05);
      border-bottom:1px solid var(--sk-toolbar-border);
    }

    /* --- Cuerpo: sidebar + main + panel derecho --- */
    .sk-body{
      display:grid;
      grid-template-columns: 220px minmax(0,1fr) 280px;
      flex:1;
      min-height:0;
    }
    .sk-sidebar{
      background: var(--sk-sidebar-bg);
      border-right:1px solid var(--sk-border);
      padding:16px 12px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }
    .sk-sidebar-footer{
      margin-top:auto;
      padding:10px 4px 2px;
      border-top:1px solid var(--sk-border);
      font-size:10.5px;
      line-height:1.5;
      color:var(--sk-muted);
    }
    .sk-sidebar-footer .sk-author-top a{
      color: var(--sk-primary);
      text-decoration:none;
      font-weight:650;
    }
    .sk-sidebar-footer .sk-author-top a:hover{ text-decoration:underline; }
    .sk-sidebar-nav{
      display:flex;
      flex-direction:column;
      gap:3px;
    }
    .sk-sidebar-item{
      display:block;
      text-align:left;
      border:none;
      border-left:2px solid transparent;
      background:transparent;
      color:var(--sk-muted);
      font-size:13px;
      font-weight:600;
      padding:9px 12px;
      border-radius:9px;
      cursor:pointer;
      margin:0;
      box-shadow:none;
      width:100%;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }
    .sk-sidebar-item:hover{ background:rgba(28,122,76,.08); color:var(--sk-text); }
    .sk-sidebar-item.active{
      background:rgba(28,122,76,.14);
      color:var(--sk-primary);
      border-left-color: var(--sk-accent);
      box-shadow: -1px 0 8px var(--sk-glow);
    }
    .sk-sidebar-section h3{
      margin:0 0 8px;
      font-size:11.5px;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:var(--sk-muted);
      font-weight:750;
      padding:0 4px;
    }
    .sk-search-input{
      width:100%;
      padding:7px 10px;
      font-size:12.5px;
      border-radius:9px;
      border:1px solid var(--sk-border);
      background:#ffffff;
      color:var(--sk-text);
      margin-bottom:8px;
      outline:none;
    }
    .sk-search-input:focus{ border-color:var(--sk-primary-2); }

    .sk-main{
      padding:20px;
      overflow-x:hidden;
      min-width:0;
    }
    .sk-rightpanel{
      background: var(--sk-sidebar-bg);
      border-left:1px solid var(--sk-border);
      padding:18px 16px;
    }
    .sk-rightpanel h3{
      margin:18px 0 10px;
      font-size:11.5px;
      text-transform:uppercase;
      letter-spacing:.06em;
      color:var(--sk-muted);
      font-weight:750;
    }
    .sk-rightpanel h3:first-child{ margin-top:0; }
    .sk-stats-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    .sk-stat{
      position:relative;
      background:#ffffff;
      border:1px solid var(--sk-border);
      border-radius:12px;
      padding:12px 10px 10px;
      display:flex;
      flex-direction:column;
      gap:2px;
      overflow:hidden;
      transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
    }
    .sk-stat::before{
      content:"";
      position:absolute;
      top:0; left:0; right:0;
      height:2px;
      background: linear-gradient(90deg, var(--sk-primary), var(--sk-accent));
      opacity:.75;
    }
    .sk-stat:hover{
      transform: translateY(-1px);
      border-color: rgba(46,174,114,.4);
      box-shadow: 0 6px 18px var(--sk-glow);
    }
    .sk-stat-num{
      font-size:21px;
      font-weight:800;
      font-variant-numeric: tabular-nums;
      font-feature-settings:"tnum";
      background: linear-gradient(120deg, var(--sk-primary), var(--sk-primary-2));
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .sk-stat-num.sk-stat-pulse{ animation: sk-stat-pop .5s ease; }
    @keyframes sk-stat-pop{
      0%{ transform:scale(1); text-shadow:0 0 0 rgba(62,207,142,0); }
      35%{ transform:scale(1.14); text-shadow:0 0 12px var(--sk-glow-strong); }
      100%{ transform:scale(1); text-shadow:0 0 0 rgba(62,207,142,0); }
    }
    .sk-stat-label{
      font-size:10px;
      color:var(--sk-muted);
      line-height:1.3;
    }
    .sk-fuentes-preview{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .sk-fuente-item{
      position:relative;
      font-size:11.5px;
      line-height:1.4;
      padding:8px 10px 8px 13px;
      background:#ffffff;
      border:1px solid var(--sk-border);
      border-left:2px solid var(--sk-primary-2);
      border-radius:10px;
      color:var(--sk-text);
      word-break:break-word;
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    .sk-fuente-item:hover{ box-shadow:0 0 0 1px var(--sk-border), 0 4px 14px var(--sk-glow); }
    .sk-fuente-item a{ color:var(--sk-primary); text-decoration:none; }
    .sk-fuente-item a:hover{ text-decoration:underline; }

    textarea {
      width: 100%;
      min-height: 200px;
      resize: vertical;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 14.5px;
      line-height:1.55;
      border-radius: 12px;
      border: 1px solid var(--sk-border);
      background:#ffffff;
      color:var(--sk-text);
      outline:none;
      transition:border-color .16s ease, box-shadow .16s ease;
    }
    textarea:focus {
      border-color: var(--sk-primary-2);
      box-shadow:0 0 0 3px rgba(62,207,142,.20);
    }
    .panel {
      position:relative;
      background: var(--sk-card);
      border-radius: var(--sk-radius);
      border: 1px solid var(--sk-border);
      padding: 20px 22px;
      box-shadow: var(--sk-shadow);
      font-size: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      margin-bottom:18px;
      overflow:hidden;
    }
    .panel::before{
      content:"";
      position:absolute;
      top:0; left:0; right:0;
      height:2px;
      background: linear-gradient(90deg, transparent, var(--sk-accent), transparent);
      opacity:.6;
    }
    .panel h2 {
      margin-top: 0;
      margin-bottom:14px;
      font-size: 16px;
      font-weight:700;
      color: var(--sk-text);
      letter-spacing:.01em;
    }
    .panel h3 {
      margin: 16px 0 6px;
      font-size: 13px;
      color: var(--sk-text);
      font-weight:700;
    }
    .panel pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      font-size: 12.5px;
      line-height:1.55;
      background: #f7faf7;
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--sk-border);
      margin-bottom: 10px;
      color:var(--sk-text);
      max-height: 360px;
      overflow:auto;
    }
    button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 15px;
      font-size: 13px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--sk-primary), var(--sk-primary-2));
      color: #fff;
      margin-top: 8px;
      margin-right: 8px;
      font-weight:600;
      box-shadow: 0 2px 8px rgba(20,60,38,.18);
      transition: background .15s ease, opacity .15s ease, transform .1s ease, box-shadow .15s ease;
    }
    button:hover{ box-shadow: 0 4px 16px var(--sk-glow-strong); }
    button:active{ transform: scale(.98); }
    button.secondary {
      background: rgba(28,122,76,.10);
      color: var(--sk-primary);
      border-color: var(--sk-border);
    }
    button.secondary:hover{ background: rgba(28,122,76,.18); }
    button:disabled { opacity: 0.5; cursor: default; transform:none; }

    .tags { margin-top: 12px; font-size: 11.5px; color: var(--sk-muted); line-height:1.9; }
    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid var(--sk-border);
      margin-right: 5px;
      margin-bottom: 5px;
      background:rgba(28,122,76,.07);
      color:var(--sk-primary);
      font-weight:600;
    }
    .badge-area {
      display: inline-block;
      margin: 0 0 12px;
      padding: 5px 11px;
      border-radius: 999px;
      border: 1px solid var(--sk-border);
      font-size: 12px;
      background: rgba(28,122,76,.09);
      color:var(--sk-primary);
      font-weight:650;
    }
    .version-selector{
      background:#f7faf7;
      border:1px solid var(--sk-border);
      border-radius:12px;
      padding:12px 14px;
      margin:8px 0 12px;
      line-height:1.7;
    }
    .version-selector label{ cursor:pointer; display:block; padding:4px 6px; border-radius:8px; font-weight:600; }
    .version-selector label:hover{ background: rgba(28,122,76,.07); }
    input[type="radio"]{ accent-color: var(--sk-primary); transform:scale(1.05); margin-right:6px; vertical-align:middle; }

    body.sk-dark{
      --sk-bg:#0d1712;
      --sk-card:rgba(18,32,24,.86);
      --sk-card-solid:#12201a;
      --sk-text:#eaf5ee;
      --sk-muted:#93a89b;
      --sk-border:rgba(120,200,150,.16);
      --sk-toolbar-bg:rgba(13,23,18,.78);
      --sk-toolbar-border:rgba(120,200,150,.12);
      --sk-sidebar-bg:rgba(15,27,20,.6);
      --sk-glow: rgba(62,207,142,.28);
      --sk-glow-strong: rgba(62,207,142,.55);
      --sk-mesh-1: rgba(62,207,142,.14);
      --sk-mesh-2: rgba(46,174,114,.10);
      --sk-grid-line: rgba(120,200,150,.05);
    }
    body.sk-dark .sk-stat::before,
    body.sk-dark .panel::before{ opacity:.9; }
    body.sk-dark textarea{ background:#12201a; color:var(--sk-text); }
    body.sk-dark .panel pre{ background:#0f1c15; color:var(--sk-text); }
    body.sk-dark .version-selector{ background:#0f1c15; }
    body.sk-dark .sk-theme-toggle-clean,
    body.sk-dark .sk-icon-btn-clean{ background:rgba(62,207,142,.10); }
    body.sk-dark .sk-theme-toggle-clean:hover,
    body.sk-dark .sk-icon-btn-clean:hover{ background:rgba(62,207,142,.18); }
    body.sk-dark .sk-search-input,
    body.sk-dark .sk-stat,
    body.sk-dark .sk-fuente-item{ background:#12201a; }
    body.sk-dark .sk-step:not(.active) .sk-step-num{ background:rgba(62,207,142,.14); color:var(--sk-accent); }
    body.sk-dark .sk-topbar-logo{
      filter:
        drop-shadow(-1px -1px 1.5px rgba(120,200,150,.25))
        drop-shadow(1.5px 2.5px 3px rgba(0,0,0,.6));
    }

    .sk-historial-lista{ display:flex; flex-direction:column; gap:6px; margin:0 0 4px; }
    .sk-historial-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      text-align:left;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid var(--sk-border);
      background:#ffffff;
      color:var(--sk-text);
      font-size:11.5px;
      line-height:1.4;
      cursor:pointer;
      width:100%;
    }
    .sk-historial-item:hover{ background: rgba(28,122,76,.06); }
    .sk-historial-item .sk-historial-texto{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sk-historial-item .sk-historial-fecha{ flex-shrink:0; font-size:10px; color:var(--sk-muted); }
    .sk-historial-vacio{ font-size:12px; color:var(--sk-muted); font-style:italic; }
    body.sk-dark .sk-historial-item{ background:#12201a; }
    body.sk-dark .sk-historial-item:hover{ background: rgba(62,207,142,.10); }

    .visual-svg-box{
      overflow-x:auto;
      border:1px solid var(--sk-border);
      border-radius:12px;
      padding:10px;
      background:#f7faf7;
      margin-bottom:14px;
    }
